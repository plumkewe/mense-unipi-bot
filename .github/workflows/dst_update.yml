name: Aggiorna Worker per cambio ora (DST)

on:
  schedule:
    # Controlla ogni domenica di marzo e ottobre alle 02:30 UTC (dopo il cambio ora delle 01:00 UTC)
    - cron: "30 2 * 3,10 0"
  workflow_dispatch:
    inputs:
      season:
        description: "Stagione da applicare (lascia vuoto per rilevamento automatico)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - winter
          - summer

permissions:
  contents: write

jobs:
  update-dst:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Controlla e aggiorna cron in wrangler.toml
        id: check_update
        env:
          INPUT_SEASON: ${{ github.event.inputs.season }}
        run: |
          python3 << 'EOF'
          import os, re, textwrap, zoneinfo
          from datetime import datetime

          # 1. Determina la stagione target
          forced_season = os.environ.get("INPUT_SEASON", "").strip()
          if forced_season:
              target_season = forced_season
              print(f"Stagione forzata da input manuale: {target_season}")
          else:
              tz = zoneinfo.ZoneInfo("Europe/Rome")
              now = datetime.now(tz)
              is_dst = bool(now.dst())
              target_season = "summer" if is_dst else "winter"
              print(f"Ora italiana corrente: {now} (DST attivo: {is_dst}) → Stagione target: {target_season}")

          # 2. Leggi wrangler.toml corrente
          with open("cloudflare-worker/wrangler.toml", "r") as f:
              content = f.read()

          current_season = "summer" if "0 22 * * *" in content else "winter"
          print(f"Configurazione attuale in wrangler.toml: {current_season}")

          # 3. Verifica se è necessario aggiornare
          if current_season == target_season and not forced_season:
              print(f"wrangler.toml è già configurato correttamente per {target_season}. Nessun aggiornamento necessario.")
              with open(os.environ["GITHUB_OUTPUT"], "a") as gh_out:
                  gh_out.write("needs_update=false\n")
                  gh_out.write(f"season={target_season}\n")
              exit(0)

          # 4. Applica nuovi trigger
          if target_season == "summer":
              triggers = textwrap.dedent("""\
                  [triggers]
                  crons = [
                    "0 22 * * *",    # update_menu       — CEST (estate, 00:00 IT)
                    "21 23 * * *",   # generate_images   — CEST (estate, 01:21 IT)
                    "17 7 * * *",    # publish_instagram — CEST (estate, 09:17 IT)
                  ]""")
          else:
              triggers = textwrap.dedent("""\
                  [triggers]
                  crons = [
                    "0 23 * * *",    # update_menu       — CET  (inverno, 00:00 IT)
                    "21 0 * * *",    # generate_images   — CET  (inverno, 01:21 IT)
                    "17 8 * * *",    # publish_instagram — CET  (inverno, 09:17 IT)
                  ]""")

          # Sostituisce tutto da [triggers] in poi
          content = re.sub(r'\[triggers\][\s\S]*$', triggers, content)

          with open("cloudflare-worker/wrangler.toml", "w") as f:
              f.write(content)

          print(f"wrangler.toml aggiornato per stagione: {target_season}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as gh_out:
              gh_out.write("needs_update=true\n")
              gh_out.write(f"season={target_season}\n")
          EOF

      - name: Setup Node.js
        if: steps.check_update.outputs.needs_update == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Installa dipendenze
        if: steps.check_update.outputs.needs_update == 'true'
        run: npm install
        working-directory: cloudflare-worker

      - name: Deploy Worker con nuovi cron
        if: steps.check_update.outputs.needs_update == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
        working-directory: cloudflare-worker

      - name: Commit wrangler.toml aggiornato
        if: steps.check_update.outputs.needs_update == 'true'
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add cloudflare-worker/wrangler.toml
          git diff --staged --quiet || git commit -m "chore: aggiorna cron worker DST → ${{ steps.check_update.outputs.season }} $(date -u '+%Y-%m-%d') [skip ci]"
          git push
